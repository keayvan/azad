<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#5b5bf0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#22b8cf;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Rounded square background -->
  <rect x="0" y="0" width="64" height="64" rx="16" fill="url(#grad)" />
  <!-- White ring (circle) -->
  <circle cx="32" cy="32" r="16" fill="none" stroke="white" stroke-width="6" />
  <!-- White dot at upper right of ring -->
  <circle cx="46" cy="18" r="4" fill="white" />
</svg>
